spring.application.name=authorization-server
spring.config.import=configserver:
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config_user}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=30
spring.cloud.config.retry.initial-interval=2000
# Keystore configuration
app.keystore.dir=${KEYSTORE_DIR:./keystore}
app.keystore.alias=${KEYSTORE_ALIAS:keystore_alias}
app.keystore.validity-days=${KEYSTORE_VALIDITY_DAYS:365}
app.keystore.renewal-threshold-days=${KEYSTORE_RENEWAL_THRESHOLD_DAYS:30}
app.keystore.overlap-days=${KEYSTORE_OVERLAP_DAYS:30}
springdoc.swagger-ui.enabled=false
# Flyway placeholders
spring.flyway.placeholders.SECURITY_DB_SERVER_NAME=${SECURITY_DB_SERVER_NAME:security_server}
spring.flyway.placeholders.SECURITY_DB_HOST=${SECURITY_DB_HOST:localhost}
spring.flyway.placeholders.SECURITY_DB_PORT=${SECURITY_DB_PORT:5432}
spring.flyway.placeholders.SECURITY_DB_NAME=${SECURITY_DB_NAME:security_db}
spring.flyway.placeholders.SECURITY_DB_USER=${SECURITY_DB_USER:postgres}
spring.flyway.placeholders.SECURITY_DB_PASSWORD=${SECURITY_DB_PASSWORD:postgres}
spring.web.resources.add-mappings=false
auth.server.issuer=${OAUTH2_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URI:http://localhost:9000}
spring.web.error.whitelabel.enabled=false
spring.web.error.include-message=always
spring.web.error.include-binding-errors=never
# App properties
app.internal.secret=${APP_INTERNAL_SECRET:default_internal_secret}
app.internal.allowed-services=${APP_INTERNAL_ALLOWED_SERVICES:electronic-signatures}